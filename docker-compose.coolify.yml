# Variante para COOLIFY. Los secretos los genera Coolify (variables mágicas SERVICE_PASSWORD_*),
# así que no hay que escribir ninguna contraseña de base de datos ni el APP_SECRET.
# Variables que SÍ defines tú en Coolify:  APP_URL, (opcional) SMTP_*, PLATFORM_ADMIN_EMAIL, PLATFORM_ADMIN_PASSWORD.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reloj
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: reloj_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloj -d reloj_saas"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://reloj:${SERVICE_PASSWORD_POSTGRES}@db:5432/reloj_saas?schema=public
      API_PORT: 4000
      APP_URL: ${APP_URL}
      APP_SECRET: ${SERVICE_PASSWORD_64_APPSECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_REQUIRE_MFA: ${PLATFORM_REQUIRE_MFA:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Cloudflare → Traefik → web → api = 3 saltos de proxy de confianza (IP real del cliente en los límites).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-3}

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-ChecaFácil}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api
    # El dominio lo asigna Coolify (Traefik) al puerto interno 3000; no se publica un puerto del host.
    expose:
      - "3000"

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: reloj
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: reloj_saas
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Respaldos diarios en /backups (se conservan $${BACKUP_KEEP_DAYS} días)"
        while true; do
          f=/backups/reloj_$$(date +%Y-%m-%d_%H%M).dump
          if pg_dump -Fc -f "$$f"; then echo "OK $$f"; else echo "FALLÓ el respaldo"; rm -f "$$f"; fi
          find /backups -name 'reloj_*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done

volumes:
  pgdata:
  backups:
